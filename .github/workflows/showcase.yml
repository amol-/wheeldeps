name: Showcase Consolidatewheels

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  showcase:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Set up MSVC command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install make on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install make --yes --no-progress

      - name: Install Python dependencies on Linux/macOS
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cython auditwheel delocate consolidatewheels

      - name: Install Python dependencies on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cython delvewheel consolidatewheels

      - name: Run Linux/macOS showcase
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          (cd libfoo && make)
          (cd libbar && make)
          (cd pylib1 && ./makewheel.sh)
          (cd pylib2 && ./makewheel.sh)
          python -c "import glob, subprocess; wheels = sorted(glob.glob('pylib1/wheelhouse/*.whl') + glob.glob('pylib2/wheelhouse/*.whl')); assert wheels, 'No wheels built'; subprocess.check_call(['consolidatewheels', *wheels, '--dest=patchedwheels'])"
          python scripts/verify_consolidated_wheels.py patchedwheels libfoo.so libbar.so
          python -c "import glob, subprocess, sys; wheels = sorted(glob.glob('patchedwheels/*.whl')); assert wheels, 'No patched wheels'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels])"
          python pyparent/test.py

      - name: Run Windows showcase
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set SHELL=cmd
          make -C libfoo
          make -C libbar
          cd pylib1
          call makewheel.bat
          cd ..
          cd pylib2
          call makewheel.bat
          cd ..
          python -c "import glob, subprocess; wheels = sorted(glob.glob('pylib1/wheelhouse/*.whl') + glob.glob('pylib2/wheelhouse/*.whl')); assert wheels, 'No wheels built'; subprocess.check_call(['consolidatewheels', *wheels, '--dest=patchedwheels'])"
          python scripts/verify_consolidated_wheels.py patchedwheels foo.dll bar.dll
          python -c "import glob, subprocess, sys; wheels = sorted(glob.glob('patchedwheels/*.whl')); assert wheels, 'No patched wheels'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels])"
          python pyparent/test.py
